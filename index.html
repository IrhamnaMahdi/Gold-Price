<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Price Intelligence — Executive Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palet resmi BSI + turunannya (tint/shade). Prioritas highlight: #08A19E (tosca) & #F8BC51 (gold). */
    --bsi-priority-teal:#08A19E;
    --bsi-priority-gold:#F8BC51;
    --bsi-orange:#ED8B00;
    --bsi-blue:#0047BB;
    --bsi-navy:#001489;
    --bsi-white:#FFFFFF;
    --bsi-charcoal:#3C3C3C;

    --ink:#056967;
    --ink-soft:#08A19E;
    --ink-line:rgba(255,255,255,.14);
    --paper:#FFFFFF;
    --paper-card:#FFFFFF;
    --line:#E6E9F5;
    --gold:#F8BC51;
    --gold-bright:#F9C466;
    --gold-pale:#FEF5E5;
    --green:#08A19E;
    --green-pale:#DFF3F2;
    --red:#AB6400;
    --red-pale:#F5ECE0;
    --amber:#ED8B00;
    --amber-pale:#FDF0DE;
    --blue:#0047BB;
    --blue-pale:#E6EDF8;
    --teal:#08A19E;
    --teal-pale:#DFF3F2;
    --purple:#001489;
    --purple-pale:#E6EDF8;
    --ink-text:#3C3C3C;
    --muted:#767676;
    --shadow:0 1px 3px rgba(0,20,137,.06), 0 6px 18px rgba(0,20,137,.05);
    --shadow-hover:0 4px 10px rgba(0,20,137,.08), 0 14px 30px rgba(0,20,137,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--paper);
    color:var(--ink-text);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .app{display:flex; min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:236px; flex:none; background:linear-gradient(180deg,#056967,#08A19E 55%,#056967); color:#DFF3F2;
    padding:22px 0 22px 0; position:sticky; top:0; height:100vh; overflow-y:auto; box-shadow:2px 0 18px rgba(0,0,0,.12);
  }
  .brand{padding:0 20px 18px 20px; border-bottom:1px solid var(--ink-line); margin-bottom:10px;}
  .ribbon{height:5px; background:linear-gradient(90deg,#F8BC51,#08A19E,#0047BB,#001489,#ED8B00,#F8BC51); margin:-30px -38px 26px -38px; border-radius:0 0 3px 3px;}
  @media (max-width:760px){.ribbon{margin:-22px -16px 22px -16px;}}
  .brand-mark{background:linear-gradient(90deg,#FEF5E5,#F8BC51 60%,#FEF5E5); -webkit-background-clip:text; background-clip:text; color:transparent; font-family:'IBM Plex Serif',serif; font-size:19px; font-weight:700; letter-spacing:.2px;}
  .brand-sub{font-size:11px; color:#BDEAE7; margin-top:4px; line-height:1.5;}
  nav{display:flex; flex-direction:column; margin-top:6px;}
  .navbtn{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none;
    color:#CFF0EE; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:11px 20px;
    cursor:pointer; border-left:3px solid transparent; transition:background .12s ease;
  }
  .navbtn:hover{background:rgba(255,255,255,.06); color:#FFFFFF;}
  .navbtn.active{background:rgba(241,180,52,.16); color:#FDF4E3; border-left:3px solid var(--gold-bright); font-weight:700; box-shadow:inset 0 0 18px rgba(241,180,52,.10);}
  .navbtn .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8AD4D0; width:16px;}
  .navbtn.active .n{color:var(--gold-bright);}
  .sidebar-foot{padding:16px 20px 0 20px; margin-top:12px; border-top:1px solid var(--ink-line); font-size:10.5px; color:#A8E2DF; line-height:1.6;}
  .auth-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:5px 10px; border-radius:14px; cursor:pointer; border:none; font-family:'IBM Plex Sans',sans-serif; font-weight:600;}
  .auth-pill.locked{background:rgba(255,255,255,.10); color:#DFF3F2;}
  .auth-pill.unlocked{background:rgba(0,191,178,.22); color:#DEF7F5;}
  .live-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-family:'IBM Plex Mono',monospace; padding:5px 10px; border-radius:14px; background:var(--green-pale); color:var(--green); font-weight:600;}
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}

  /* ---------- MAIN ---------- */
  main{flex:1; min-width:0; padding:30px 38px 60px 38px;}
  .topbar{display:flex; justify-content:flex-start; align-items:flex-start; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
  .pagetitle{font-family:'IBM Plex Serif',serif; font-size:27px; font-weight:700; background:linear-gradient(90deg,#001489,#08A19E 55%,#F8BC51); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .pagesub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .pagesub-row{display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap;}
  .datebadge{background:linear-gradient(120deg,#001489,#0047BB); color:var(--gold-pale); font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:8px 14px; border-radius:20px; white-space:nowrap; box-shadow:var(--shadow);}

  .grid{display:grid; gap:16px;}
  .kpi-grid{grid-template-columns:repeat(6,1fr);}
  @media (max-width:1300px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:760px){.kpi-grid{grid-template-columns:repeat(2,1fr);} main{padding:22px 16px 50px 16px;}}

  .card{background:var(--paper-card); border:1px solid var(--line); border-radius:10px; padding:16px 17px; box-shadow:var(--shadow); transition:box-shadow .18s ease, transform .18s ease;}
  .kpi{display:flex; flex-direction:column; gap:6px; min-height:118px; border-top:4px solid var(--gold-bright); position:relative;}
  .kpi:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .kpi-grid .card:nth-child(1){border-top-color:#F8BC51;}
  .kpi-grid .card:nth-child(2){border-top-color:#4DBBB9;}
  .kpi-grid .card:nth-child(3){border-top-color:#007C80;}
  .kpi-grid .card:nth-child(4){border-top-color:#ED8B00;}
  .kpi-grid .card:nth-child(5){border-top-color:#056967;}
  .kpi-grid .card:nth-child(6){border-top-color:#08A19E;}
  .kpi-label{font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.1px; display:flex; align-items:center; gap:6px;}
  .kpi-value{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; color:var(--ink-text); line-height:1.25;}
  .kpi-value.big{font-size:23px;}
  .kpi-sub{font-size:11.5px; color:var(--muted);}
  .kpi-sub.pos{color:var(--green); font-weight:600;}
  .kpi-sub.neg{color:var(--red); font-weight:600;}

  .section-title{font-family:'IBM Plex Serif',serif; font-size:17.5px; font-weight:700; margin:34px 0 12px 0; color:var(--ink-text); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-bottom:9px; border-bottom:3px solid transparent; border-image:linear-gradient(90deg,#F8BC51,#08A19E,#0047BB) 1; }
  .section-title:first-of-type{margin-top:0;}
  .section-note{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Sans',sans-serif; font-weight:400;}

  select, input[type=date], input[type=text], input[type=number]{
    font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; padding:7px 9px; border:1px solid var(--line);
    border-radius:3px; background:#fff; color:var(--ink-text);
  }
  .datepart-sel{padding:7px 8px; min-width:56px;}
  .datepart-group{display:inline-flex; gap:6px; align-items:center;}
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{
    text-align:left; font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:11px; color:#fff;
    background:linear-gradient(120deg,#056967,#08A19E); border-bottom:none; padding:10px 10px; white-space:nowrap;
  }
  tbody td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody tr:hover{background:#F5F7FC;}
  .num-cell{font-family:'IBM Plex Mono',monospace; text-align:right;}
  .tag{display:inline-block; padding:3px 10px; border-radius:12px; font-size:10.5px; font-weight:700;}
  .tag-green{background:var(--green-pale); color:var(--green);}
  .tag-amber{background:var(--amber-pale); color:var(--amber);}
  .tag-red{background:var(--red-pale); color:var(--red);}
  .tag-blue{background:var(--blue-pale); color:var(--blue);}
  .row-rank1{background:var(--green-pale) !important;}
  .row-rank2{background:var(--gold-pale) !important;}
  .row-rankLast{background:var(--red-pale) !important;}
  .row-bsi td:first-child{border-left:3px solid var(--blue);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);}
  .table-wrap table{min-width:640px;}
  .table-wrap thead th, .table-wrap tbody td{white-space:nowrap;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:2px; display:inline-block;}

  .chart-card{padding:20px; box-shadow:none;}
  .svgchart{width:100%; height:auto; display:block;}
  .svgchart .gridline{stroke:#E6E9F5; stroke-width:1;}
  .svgchart .axis-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:var(--muted);}
  .svgchart .series-line{fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;}
  .svgchart .series-dot{stroke:#fff; stroke-width:1.4;}
  .hover-capture{cursor:crosshair;}
  .chart-tooltip{
    position:fixed; display:none; z-index:80; background:#001489; color:#fff; padding:10px 13px; border-radius:8px;
    font-size:11.5px; font-family:'IBM Plex Sans',sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.25); pointer-events:none;
    min-width:150px; max-width:260px;
  }
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--ink-text);}
  .chart-legend span{display:inline-flex; align-items:center; gap:6px;}
  .chart-legend i{width:11px; height:11px; border-radius:2px; display:inline-block;}
  .chart-tt{font-family:'IBM Plex Mono',monospace; font-size:9.5px; fill:var(--ink-text);}
  .bullet-row{display:grid; grid-template-columns:130px 1fr 130px; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line);}
  .bullet-row:last-child{border-bottom:none;}
  .bullet-track{background:#EDE9DC; border-radius:3px; height:22px; position:relative; overflow:hidden;}
  .bullet-fill{position:absolute; top:0; left:0; height:100%; border-radius:3px;}
  .bullet-fill.bsi{background:var(--blue);}
  .bullet-fill.market{background:var(--gold);}
  .bullet-label{font-size:12px; font-weight:600;}
  .bullet-val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right;}

  .insight-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .insight-list li{background:var(--paper-card); border:1px solid var(--line); border-left:4px solid var(--gold-bright); border-radius:8px; padding:13px 15px; font-size:13px; line-height:1.55; box-shadow:var(--shadow);}
  .insight-list b{color:var(--ink-text);}

  .heat-cell{padding:6px 11px; border-radius:12px; font-size:11.5px; font-weight:700; text-align:center; display:inline-block; min-width:118px; box-shadow:0 1px 2px rgba(0,0,0,.06);}

  form.input-form{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:900px){form.input-form{grid-template-columns:repeat(2,1fr);}}
  .btn{
    font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:12.5px; padding:10px 18px; border-radius:22px;
    border:none; background:linear-gradient(120deg,#056967,#08A19E); color:#FFFFFF; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-hover);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none;}
  .btn-ghost:hover{background:#DFF3F2; transform:none; box-shadow:none;}
  .btn-danger{background:transparent; border:none; color:var(--red); cursor:pointer; font-size:12px; font-weight:700;}
  .tabbar{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tabbar button{
    font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:600; padding:8px 15px; border-radius:18px; border:1px solid var(--line);
    background:#fff; cursor:pointer; color:var(--muted); box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .tabbar button:hover{transform:translateY(-1px);}
  .tabbar button.active{background:linear-gradient(120deg,#056967,#08A19E); color:#FFFFFF; border-color:#08A19E;}
  .flag{font-size:11px; color:var(--muted); font-style:italic; margin-top:8px;}
  .empty{color:var(--muted); font-size:13px; padding:20px; text-align:center;}
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--gold-pale); padding:11px 18px;
    border-radius:4px; font-size:12.5px; opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Gold Price Intel</div>
      <div class="brand-sub">Executive Monitoring Dashboard<br>Data emas harian · Multi-supplier</div>
    </div>
    <nav id="navbar"></nav>
    <div id="authWidget" class="sidebar-foot"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   DATA MODEL
   ===================================================================== */
const CATEGORY_META = {
  rekening: {label:'Rekening Emas (Aplikasi)', short:'Rekening',
    companies:['BSI (Byond)','Antam (Brankas)','Tring (Pegadaian Digital)','Pluang (Antam) 1 gr','IndoGold 1 gr','Lakuemas','Brimo 1 gr','Treasury']},
  fisik: {label:'Fisik 1 Gram', short:'Fisik 1gr',
    companies:['BSI Gold 1 gr','Antam (Fisik) 1 gr','Hartadinata (emasku) 1 gr','Lotus Archi','UBS','Galeri 24','Habibie Gold (LM Antam)','Agung Cikini Gold Center (LM Antam)','Mulia Gold (LM Antam)','StoneX']},
  kilobar: {label:'Fisik Kilobar', short:'Kilobar',
    companies:['BSI Gold 1000 gr','Hartadinata (emasku) 1000 gr','UOB (Cast Bars 1 kilobar)','StoneX (kilogram)','Lotus Archi 1000 gr','Galeri 24 1000 gr','Amman Mineral Nusa Tenggara 1000 gr','XAU','Loco London']}
};
const KILOBAR_SHORT = {
  'BSI Gold 1000 gr':'BSI','Amman Mineral Nusa Tenggara 1000 gr':'AMNT','Lotus Archi 1000 gr':'Lotus',
  'Hartadinata (emasku) 1000 gr':'Hartadinata','UOB (Cast Bars 1 kilobar)':'UOB'
};
const TREND_COMPANIES = Object.keys(KILOBAR_SHORT);
// Warna disesuaikan tema/brand masing-masing perusahaan (sejauh memungkinkan)
const BRAND_COLORS = {
  'BSI':'#08A19E',
  'INDOGOLD':'#E65100',
  'TRING':'#00C853',
  'BRIMO':'#00529C',
  'PLUANG':'#7C4DFF',
  'TREASURY':'#FFD700',
  'LAKUEMAS':'#FF1744',
  'HARTADINATA':'#880E4F',
  'STONEX':'#263238',
  'LOTUS':'#F48FB1',
  'MULIA':'#F57F17',
  'GALERI 24':'#2E7D32',
  'UBS':'#D50000',
  'HABIBIE':'#8D6E63',
  'AGUNG CIKINI':'#4A148C',
  'AMMAN':'#003676',
  'LOCO LONDON':'#2979FF',
  'XAU':'#FF6D00',
  'UOB':'#002D62',
  'ANTAM':'#B78103'   // diletakkan terakhir: beberapa nama LM Antam (Mulia/Habibie/Agung Cikini) mengandung kata "Antam" juga
};
function brandColor(company, fallbackIndex){
  const up = company.toUpperCase();
  for(const key in BRAND_COLORS){ if(up.includes(key)) return BRAND_COLORS[key]; }
  return PALETTE[fallbackIndex % PALETTE.length];
}

/* =====================================================================
   FIREBASE (sumber data bersama & real-time)
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3HHp5toqwj8mRMHBfF7M_BHBSFv-jB2c",
  authDomain: "gold-price-dashboard-29465.firebaseapp.com",
  projectId: "gold-price-dashboard-29465",
  storageBucket: "gold-price-dashboard-29465.firebasestorage.app",
  messagingSenderId: "696613582304",
  appId: "1:696613582304:web:c9a203781981a073b8a785"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const WRITE_EMAIL = 'tim@gold-dashboard.internal'; // identitas login bersama, bukan email sungguhan

let RECORDS = [];
let dataLoaded = false;
let loadError = null;
let isEditMode = false;
let lastSyncAt = null;

onAuthStateChanged(auth, user=>{
  isEditMode = !!user;
  renderAuthWidget();
});

function docToRecords(dateId, data){
  const out = [];
  ['rekening','fisik','kilobar'].forEach(cat=>{
    (data[cat]||[]).forEach(entry=>{
      if(!entry || !entry.company) return;
      out.push({date:dateId, category:cat, company:entry.company, beli:entry.beli, jual:entry.jual===undefined?null:entry.jual});
    });
  });
  return out;
}

function startLiveSync(){
  const col = collection(db,'prices');
  onSnapshot(col, snapshot=>{
    const all = [];
    snapshot.forEach(docSnap=>{ all.push(...docToRecords(docSnap.id, docSnap.data())); });
    RECORDS = all;
    dataLoaded = true;
    loadError = null;
    lastSyncAt = new Date();
    if(activeTab==='input'){
      // hindari menimpa form yang sedang diisi user; cukup update data diam-diam
      renderAuthWidget();
      const badge = document.getElementById('liveBadge');
      if(badge) badge.outerHTML = liveBadgeHtml();
    } else {
      renderAll();
    }
  }, err=>{
    console.error('Firestore sync error', err);
    loadError = err.message || String(err);
    renderAll();
  });
}

async function ensureEditAccess(){
  if(auth.currentUser) return true;
  const pin = prompt('Masukkan PIN tim untuk menambah/mengubah data:');
  if(!pin) return false;
  try{
    await signInWithEmailAndPassword(auth, WRITE_EMAIL, pin);
    return true;
  }catch(e){
    alert('PIN salah, atau gagal masuk. Silakan coba lagi.');
    return false;
  }
}

async function upsertEntry(date, category, company, beli, jual){
  if(!(await ensureEditAccess())) return false;
  if(category==='kilobar'){ beli = normKilobar(beli); jual = (jual===null||jual===undefined) ? null : normKilobar(jual); }
  const ref = doc(db,'prices',date);
  const snap = await getDoc(ref);
  const data = snap.exists() ? snap.data() : {};
  const arr = Array.isArray(data[category]) ? [...data[category]] : [];
  const idx = arr.findIndex(e=>e.company===company);
  const entry = {company, beli, jual: (jual===undefined?null:jual)};
  if(idx>=0) arr[idx]=entry; else arr.push(entry);
  await setDoc(ref, {...data, [category]:arr}, {merge:true});
  return true;
}

async function deleteEntry(date, category, company){
  if(!(await ensureEditAccess())) return false;
  const ref = doc(db,'prices',date);
  const snap = await getDoc(ref);
  if(!snap.exists()) return false;
  const data = snap.data();
  const arr = (data[category]||[]).filter(e=>e.company!==company);
  await setDoc(ref, {...data, [category]:arr}, {merge:true});
  return true;
}

async function bulkUpsert(entriesByDate){
  // entriesByDate: Map<date, Array<{category, company, beli, jual}>>
  if(!(await ensureEditAccess())) return {added:0, ok:false};
  let added = 0;
  for(const [date, entries] of entriesByDate){
    const ref = doc(db,'prices',date);
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : {};
    const byCat = {rekening:[...(data.rekening||[])], fisik:[...(data.fisik||[])], kilobar:[...(data.kilobar||[])]};
    entries.forEach(e=>{
      const arr = byCat[e.category];
      const idx = arr.findIndex(x=>x.company===e.company);
      let beli = e.beli, jual = (e.jual===undefined?null:e.jual);
      if(e.category==='kilobar'){ beli = normKilobar(beli); jual = jual==null ? null : normKilobar(jual); }
      const entry = {company:e.company, beli, jual};
      if(idx>=0) arr[idx]=entry; else arr.push(entry);
      added++;
    });
    await setDoc(ref, {...data, ...byCat}, {merge:true});
  }

/* =====================================================================

const fmt = n => n===null||n===undefined||isNaN(n) ? '—' : Math.round(n).toLocaleString('id-ID');
const fmtJuta = n => n===null||n===undefined||isNaN(n) ? '—' : (n/1000000).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' Jt';
// Parser input harga singkat, contoh: "2,358 M" -> 2358000000, "2.5 Jt" -> 2500000, "2358000000" -> 2358000000
function parseShorthandPrice(str){
  if(str===null||str===undefined) return null;
  const s = String(str).trim();
  if(s==='') return null;
  const m = s.match(/^([\d.,]+)\s*(m|miliar|b|jt|juta|k|ribu)$/i);
  if(m){
    const raw = m[1];
    const numPart = raw.includes(',') ? raw.replace(/\./g,'').replace(',', '.') : raw;
    const num = parseFloat(numPart);
    if(isNaN(num)) return null;
    const suffix = m[2].toLowerCase();
    let scale = 1;
    if(suffix==='m'||suffix==='miliar'||suffix==='b') scale = 1e9;
    else if(suffix==='jt'||suffix==='juta') scale = 1e6;
    else if(suffix==='k'||suffix==='ribu') scale = 1e3;
    return Math.round(num*scale);
  }
  const cleaned = s.replace(/[^0-9\-]/g,'');
  if(cleaned===''||cleaned==='-') return null;
  return parseInt(cleaned,10);
}
const fmtPct = n => n===null||n===undefined||isNaN(n) ? '—' : n.toFixed(2)+'%';
function normKilobar(v){ if(v===null||v===undefined) return null; return v>10000000 ? v/1000 : v; }
function effVal(rec){ return rec.category==='kilobar' ? normKilobar(rec.beli) : rec.beli; }
function effJual(rec){ return rec.category==='kilobar' ? normKilobar(rec.jual) : rec.jual; }
function spreadOf(rec){ const b=effVal(rec), j=effJual(rec); if(b==null||j==null) return null; return (b-j)/b*100; }
function distinctDates(){ return [...new Set(RECORDS.map(r=>r.date))].sort(); }
function latestDate(){ const d=distinctDates(); return d[d.length-1]; }
function prevDate(){ const d=distinctDates(); return d.length>1 ? d[d.length-2] : null; }
function fmtDateLabel(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return `${day} ${months[parseInt(m)-1]} ${y}`; }

/* ---------- Date picker: Tanggal / Bulan / Tahun terpisah ---------- */
const MONTH_NAMES_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function buildDateIndex(dates){
  const byYear = new Map();       // year -> Set(month strings)
  const byYearMonth = new Map();  // 'YYYY-MM' -> [day strings]
  dates.forEach(d=>{
    const [y,m,day] = d.split('-');
    if(!byYear.has(y)) byYear.set(y, new Set());
    byYear.get(y).add(m);
    const key = y+'-'+m;
    if(!byYearMonth.has(key)) byYearMonth.set(key, []);
    byYearMonth.get(key).push(day);
  });
  return {byYear, byYearMonth};
}
function datePickerHtml(prefix, dates, selectedDate){
  if(dates.length===0) return `<span class="section-note">Belum ada data.</span>`;
  const idx = buildDateIndex(dates);
  const years = [...idx.byYear.keys()].sort().reverse();
  let [selY, selM, selD] = (selectedDate && idx.byYear.has(selectedDate.split('-')[0]) ? selectedDate : dates[dates.length-1]).split('-');
  if(!idx.byYear.has(selY)) selY = years[0];
  const months = [...idx.byYear.get(selY)].sort().reverse();
  if(!months.includes(selM)) selM = months[0];
  const days = (idx.byYearMonth.get(selY+'-'+selM)||[]).slice().sort().reverse();
  if(!days.includes(selD)) selD = days[0];
  return `
    <select id="${prefix}_day" class="datepart-sel">${days.map(d=>`<option value="${d}" ${d===selD?'selected':''}>${d}</option>`).join('')}</select>
    <select id="${prefix}_month" class="datepart-sel">${months.map(m=>`<option value="${m}" ${m===selM?'selected':''}>${MONTH_NAMES_ID[parseInt(m)-1]}</option>`).join('')}</select>
    <select id="${prefix}_year" class="datepart-sel">${years.map(y=>`<option value="${y}" ${y===selY?'selected':''}>${y}</option>`).join('')}</select>
  `;
}
function wireDatePicker(prefix, dates, onChange){
  if(dates.length===0) return;
  const idx = buildDateIndex(dates);
  const yearSel = document.getElementById(prefix+'_year');
  const monthSel = document.getElementById(prefix+'_month');
  const daySel = document.getElementById(prefix+'_day');
  if(!yearSel||!monthSel||!daySel) return;
  function current(){ return `${yearSel.value}-${monthSel.value}-${daySel.value}`; }
  function rebuildMonths(){
    const months = [...idx.byYear.get(yearSel.value)].sort().reverse();
    monthSel.innerHTML = months.map(m=>`<option value="${m}">${MONTH_NAMES_ID[parseInt(m)-1]}</option>`).join('');
  }
  function rebuildDays(){
    const days = (idx.byYearMonth.get(yearSel.value+'-'+monthSel.value)||[]).slice().sort().reverse();
    daySel.innerHTML = days.map(d=>`<option value="${d}">${d}</option>`).join('');
  }
  yearSel.addEventListener('change', ()=>{ rebuildMonths(); rebuildDays(); onChange(current()); });
  monthSel.addEventListener('change', ()=>{ rebuildDays(); onChange(current()); });
  daySel.addEventListener('change', ()=>{ onChange(current()); });
}
function byCategoryDate(cat,date){ return RECORDS.filter(r=>r.category===cat && r.date===date); }
function rankedByCategory(cat,date){
  const rows = byCategoryDate(cat,date).filter(r=>r.beli!=null).map(r=>({...r, eff:effVal(r), spread:spreadOf(r)}));
  rows.sort((a,b)=>a.eff-b.eff);
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
function isBSI(company){ return /BSI/i.test(company); }

/* =====================================================================
   3. TREND HARGA HARIAN  (dependency-free hand-built SVG line chart)
   ===================================================================== */
const TREND_HOVER_REGISTRY = {};
function buildTrendSvg(dates, series, chartId){
  const W=900, H=340, padL=68, padR=24, padT=18, padB=40;
  const plotW = W-padL-padR, plotH = H-padT-padB;

  const allVals = series.flatMap(s=>s.data.filter(v=>v!=null));
  if(allVals.length===0){
    return `<div class="empty">Belum ada data kilobar untuk ditampilkan.</div>`;
  }
  let vMin = Math.min(...allVals), vMax = Math.max(...allVals);
  if(vMin===vMax){ vMin*=0.98; vMax*=1.02; }
  const pad = (vMax-vMin)*0.12;
  vMin -= pad; vMax += pad;

  const xStep = dates.length>1 ? plotW/(dates.length-1) : 0;
  const xAt = i => padL + (dates.length>1 ? i*xStep : plotW/2);
  const yAt = v => padT + plotH - ( (v-vMin)/(vMax-vMin) )*plotH;

  TREND_HOVER_REGISTRY[chartId] = {dates, series, padL, xStep};

  const gridCount = 5;
  let gridlines = '';
  let yLabels = '';
  for(let g=0; g<=gridCount; g++){
    const v = vMin + (vMax-vMin)*g/gridCount;
    const y = yAt(v);
    gridlines += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"></line>`;
    yLabels += `<text class="axis-label" x="${padL-8}" y="${y+4}" text-anchor="end">Rp ${(v/1000000).toFixed(2)}jt</text>`;
  }
  let xLabels = '';
  const labelStep = Math.max(1, Math.ceil(dates.length/11));
  dates.forEach((d,i)=>{
    if(i%labelStep===0 || i===dates.length-1){
      xLabels += `<text class="axis-label" x="${xAt(i)}" y="${H-padB+18}" text-anchor="middle">${fmtDateLabel(d)}</text>`;
    }
  });

  let lines = '';
  // BSI digambar paling akhir (di atas garis lain) supaya selalu terlihat jelas
  const orderedSeries = [...series.filter(s=>!isBSI(s.label)), ...series.filter(s=>isBSI(s.label))];
  orderedSeries.forEach(s=>{
    const bsiHighlight = isBSI(s.label);
    const pts = s.data.map((v,i)=> v==null ? null : [xAt(i), yAt(v)]);
    // line path (allows gaps for nulls)
    let d='', drawing=false;
    pts.forEach(p=>{
      if(p==null){ drawing=false; return; }
      d += (drawing?' L ':' M ')+p[0].toFixed(1)+' '+p[1].toFixed(1);
      drawing = true;
    });
    if(bsiHighlight){
      // halo lembut di belakang garis BSI supaya menonjol dibanding garis lain
      lines += `<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"></path>`;
    }
    lines += `<path class="series-line" d="${d.trim()}" stroke="${s.color}" style="stroke-width:${bsiHighlight?4.5:2.6};"></path>`;
    if(dates.length<=45){
      pts.forEach(p=>{
        if(p==null) return;
        const size = bsiHighlight?10:8;
        lines += `<rect class="series-dot" x="${(p[0]-size/2).toFixed(1)}" y="${(p[1]-size/2).toFixed(1)}" width="${size}" height="${size}" fill="${s.color}" ${bsiHighlight?'stroke="#fff" stroke-width="2"':''}></rect>`;
      });
    }
  });

  return `<svg class="svgchart" data-chart-id="${chartId}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}${yLabels}${xLabels}${lines}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#001489" stroke-width="1"></line>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#001489" stroke-width="1"></line>
    <line id="${chartId}-guide" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#3C3C3C" stroke-width="1" stroke-dasharray="4,3" opacity="0" pointer-events="none"></line>
    <rect class="hover-capture" data-chart-id="${chartId}" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"></rect>
  </svg>`;
}

function attachTrendHover(chartId){
  const entry = TREND_HOVER_REGISTRY[chartId];
  if(!entry) return;
  const svg = document.querySelector(`svg[data-chart-id="${chartId}"]`);
  if(!svg) return;
  const capture = svg.querySelector('.hover-capture');
  const guide = document.getElementById(chartId+'-guide');
  if(!capture || !guide) return;
  let tooltip = document.getElementById('chartTooltip');
  if(!tooltip){
    tooltip = document.createElement('div');
    tooltip.id = 'chartTooltip';
    tooltip.className = 'chart-tooltip';
    document.body.appendChild(tooltip);
  }
  const {dates, series, padL, xStep} = entry;

  function idxFromEvent(evt){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const rel = loc.x - padL;
    let i = xStep>0 ? Math.round(rel/xStep) : 0;
    return Math.max(0, Math.min(dates.length-1, i));
  }
  capture.addEventListener('mousemove', evt=>{
    const i = idxFromEvent(evt);
    const x = padL + (dates.length>1 ? i*xStep : 0);
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.setAttribute('opacity','1');

    const sorted = [...series].sort((a,b)=>(isBSI(b.label)?1:0)-(isBSI(a.label)?1:0));
    const rowsHtml = sorted.filter(s=>s.data[i]!=null).map(s=>
      `<div style="display:flex; align-items:center; gap:7px; ${isBSI(s.label)?'font-weight:700;':''} padding:2px 0;">
        <span style="width:9px; height:9px; border-radius:2px; background:${s.color}; display:inline-block; flex:none;"></span>
        <span style="flex:1; white-space:nowrap;">${s.label}</span>
        <span style="font-family:'IBM Plex Mono',monospace; margin-left:12px;">Rp ${fmt(s.data[i])}</span>
      </div>`).join('');
    tooltip.innerHTML = `<div style="font-weight:700; margin-bottom:6px; font-family:'IBM Plex Mono',monospace; border-bottom:1px solid rgba(255,255,255,.25); padding-bottom:5px;">${fmtDateLabel(dates[i])}</div>${rowsHtml || '<div style="opacity:.75;">Tidak ada data</div>'}`;
    tooltip.style.display = 'block';
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let left = evt.clientX + 16, top = evt.clientY + 16;
    if(left+tw > window.innerWidth-8) left = evt.clientX - tw - 16;
    if(top+th > window.innerHeight-8) top = evt.clientY - th - 16;
    tooltip.style.left = left+'px';
    tooltip.style.top = top+'px';
  });
  capture.addEventListener('mouseleave', ()=>{
    guide.setAttribute('opacity','0');
    tooltip.style.display = 'none';
  });
}

function renderTrend(body){
  const allDates = distinctDates();
  const rangeOptions = [
    {v:60, label:'60 Hari Terakhir'},
    {v:180, label:'180 Hari Terakhir'},
    {v:'all', label:'Semua (' + allDates.length + ' Hari)'}
  ];
  if(!trendRange) trendRange = 60;
  const dates = trendRange==='all' ? allDates : allDates.slice(-trendRange);

  const idx = new Map();
  RECORDS.forEach(r=>{ idx.set(r.category+'|'+r.date+'|'+r.company, r); });

  function seriesForCategory(cat){
    let companies, colorOf, labelOf;
    if(cat==='kilobar'){
      companies = TREND_COMPANIES; // 5 supplier utama sesuai brief
      colorOf = (c,i) => brandColor(c,i);
      labelOf = c => KILOBAR_SHORT[c];
    } else {
      companies = CATEGORY_META[cat].companies;
      colorOf = (c,i) => brandColor(c,i);
      labelOf = c => c;
    }
    return companies.map((c,i)=>{
      const data = dates.map(d=>{
        const rec = idx.get(cat+'|'+d+'|'+c);
        if(!rec) return null;
        return trendMetric==='beli' ? effVal(rec) : effJual(rec);
      });
      return {label:labelOf(c), color:colorOf(c,i), data};
    }).filter(s=>s.data.some(v=>v!=null));
  }

  const sections = CATEGORY_ORDER.map(cat=>{
    const series = seriesForCategory(cat);
    const chartId = 'trend-'+cat;
    return `
    <div class="section-title">${CATEGORY_META[cat].label}
      <span class="section-note">${series.length} supplier ditampilkan</span>
    </div>
    <div class="card chart-card">
      ${dates.length===0 || series.length===0 ? '<div class="empty">Belum ada data untuk kategori ini.</div>' : buildTrendSvg(dates, series, chartId)}
      ${series.length ? `<div class="chart-legend">${[...series].sort((a,b)=>(isBSI(b.label)?1:0)-(isBSI(a.label)?1:0)).map(s=>`<span style="${isBSI(s.label)?'font-weight:700;':''}"><i style="background:${s.color}; ${isBSI(s.label)?'width:14px; height:14px; box-shadow:0 0 0 2px '+s.color+'33;':''}"></i>${s.label}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  body.innerHTML = `
  <div class="tabbar">
    <button data-m="beli" class="${trendMetric==='beli'?'active':''}">Harga Beli</button>
    <button data-m="jual" class="${trendMetric==='jual'?'active':''}">Harga Jual</button>
  </div>
  <div class="tabbar">
    ${rangeOptions.map(o=>`<button data-r="${o.v}" class="${String(trendRange)===String(o.v)?'active':''}">${o.label}</button>`).join('')}
  </div>
  ${sections}
  <div class="flag">Nilai kategori Fisik Kilobar dinormalisasi ke harga per gram agar sebanding antar supplier. Titik kosong berarti data belum diinput untuk tanggal tersebut.</div>
  `;
  body.querySelectorAll('.tabbar button[data-m]').forEach(b=>b.addEventListener('click', ()=>{ trendMetric=b.dataset.m; renderAll(); }));
  body.querySelectorAll('.tabbar button[data-r]').forEach(b=>b.addEventListener('click', ()=>{ trendRange = b.dataset.r==='all' ? 'all' : parseInt(b.dataset.r); renderAll(); }));
  CATEGORY_ORDER.forEach(cat=>attachTrendHover('trend-'+cat));
}

/* =====================================================================
   3b. SPREAD BELI-JUAL (%) — per kategori
   ===================================================================== */
function spreadTier(pct){
  if(pct<=3) return {emoji:'🟢', label:'Ketat', bg:'var(--green-pale)', fg:'var(--green)'};
  if(pct<=6) return {emoji:'🟡', label:'Sedang', bg:'var(--amber-pale)', fg:'var(--amber)'};
  return {emoji:'🔴', label:'Lebar', bg:'var(--red-pale)', fg:'var(--red)'};
}
function renderSpread(body){
  const dates = distinctDates();

  const sections = CATEGORY_ORDER.map(cat=>{
    const rows = byCategoryDate(cat, spreadDate)
      .filter(r=>r.beli!=null)
      .map(r=>{
        const beli = effVal(r), jual = effJual(r);
        const spreadRp = (jual!=null) ? beli-jual : null;
        const spreadPct = spreadOf(r);
        return {...r, beli, jual, spreadRp, spreadPct};
      });
    rows.sort((a,b)=>{
      if(a.spreadPct==null) return 1;
      if(b.spreadPct==null) return -1;
      return a.spreadPct-b.spreadPct;
    });
    const validPct = rows.filter(r=>r.spreadPct!=null).map(r=>r.spreadPct);
    const avg = validPct.length ? validPct.reduce((a,b)=>a+b,0)/validPct.length : null;

    return `
    <div class="section-title">${CATEGORY_META[cat].label}
      <span class="section-note">Rata-rata spread: ${avg==null?'—':fmtPct(avg)}</span>
    </div>
    <div class="table-wrap" style="margin-bottom:26px;">
    <table>
      <thead><tr><th>No</th><th>Perusahaan</th><th style="text-align:right;">Harga Beli</th><th style="text-align:right;">Harga Jual</th>
        <th style="text-align:right;">Spread (Rp)</th><th style="text-align:right;">Spread (%)</th></tr></thead>
      <tbody>
      ${rows.length===0 ? `<tr><td colspan="6" class="empty">Tidak ada data untuk tanggal ini.</td></tr>` :
        rows.map((r,i)=>{
          const tier = r.spreadPct==null ? null : spreadTier(r.spreadPct);
          return `<tr class="${isBSI(r.company)?'row-bsi':''}">
            <td>${i+1}</td>
            <td>${r.company}${isBSI(r.company)?' <span class="tag tag-blue">BSI</span>':''}</td>
            <td class="num-cell">Rp ${fmt(r.beli)}</td>
            <td class="num-cell">${r.jual==null?'—':'Rp '+fmt(r.jual)}</td>
            <td class="num-cell">${r.spreadRp==null?'—':'Rp '+fmt(r.spreadRp)}</td>
            <td class="num-cell" style="font-weight:700; ${tier?`background:${tier.bg}; color:${tier.fg};`:''}" title="${tier?tier.emoji+' Spread '+tier.label:''}">${fmtPct(r.spreadPct)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
  }).join('');

  body.innerHTML = `
  <div style="margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <label style="margin:0;">Tanggal:</label>
    <div class="datepart-group">${datePickerHtml('spread', dates, spreadDate)}</div>
  </div>
  <div class="legend">
    <span>🟢 Spread Ketat (≤3%)</span><span>🟡 Spread Sedang (3–6%)</span><span>🔴 Spread Lebar (&gt;6%)</span>
  </div>
  ${sections}
  <div class="flag">Spread (%) = (Harga Beli − Harga Jual) ÷ Harga Beli × 100. Warna latar pada kolom Spread (%) menunjukkan status (lihat legenda). Nilai kategori Fisik Kilobar dinormalisasi per gram agar sebanding.</div>
  `;
  wireDatePicker('spread', dates, d=>{ spreadDate=d; renderAll(); });
}

/* =====================================================================

function renderBsiVsMarket(body){
  const ld = latestDate();
  const kilo = rankedByCategory('kilobar', ld);
  const bsi = kilo.find(r=>isBSI(r.company));
  const others = kilo.filter(r=>!isBSI(r.company) && r.jual!=null);
  const bestMarket = others.length ? others.reduce((best,r)=> (effJual(r)>effJual(best)?r:best), others[0]) : null;

  const bsiJual = bsi?effJual(bsi):null;
  const marketJual = bestMarket?effJual(bestMarket):null;
  const selisihRp = (bsiJual!=null && marketJual!=null) ? bsiJual - marketJual : null;
  const selisihPct = (selisihRp!=null && marketJual) ? selisihRp/marketJual*100 : null;
  const maxVal = Math.max(bsiJual||0, marketJual||0) * 1.08;

  body.innerHTML = `
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr; margin-bottom:20px;">
    <div class="card kpi"><div class="kpi-label">Harga Jual (Buyback) BSI</div><div class="kpi-value">Rp ${fmt(bsiJual)} /gr</div></div>
    <div class="card kpi"><div class="kpi-label">Harga Jual Terbaik di Market</div><div class="kpi-value">${bestMarket?bestMarket.company:'—'}</div><div class="kpi-sub">Rp ${fmt(marketJual)} /gr</div></div>
    <div class="card kpi"><div class="kpi-label">Selisih</div><div class="kpi-value big ${selisihRp<0?'neg':'pos'}">${selisihRp==null?'—':(selisihRp<0?'-':'+')+'Rp '+fmt(Math.abs(selisihRp))}</div><div class="kpi-sub ${selisihPct<0?'neg':'pos'}">${selisihPct==null?'':fmtPct(Math.abs(selisihPct))+(selisihPct<0?' di bawah market':' di atas market')}</div></div>
  </div>
  <div class="card chart-card">
    <div class="bullet-row">
      <div class="bullet-label">BSI</div>
      <div class="bullet-track"><div class="bullet-fill bsi" style="width:${maxVal?(bsiJual/maxVal*100):0}%;"></div></div>
      <div class="bullet-val">Rp ${fmt(bsiJual)}</div>

    <div class="bullet-row">
      <div class="bullet-label">${bestMarket?bestMarket.company:'Market Terbaik'}</div>
      <div class="bullet-track"><div class="bullet-fill market" style="width:${maxVal?(marketJual/maxVal*100):0}%;"></div></div>
      <div class="bullet-val">Rp ${fmt(marketJual)}</div>

  </div>
  <div class="flag">Perbandingan menggunakan Harga Jual (buyback) kategori Fisik Kilobar, dinormalisasi per gram, tanggal ${fmtDateLabel(ld)}.</div>
  `;
}

/* =====================================================================
   6. HEATMAP KOMPETITOR
   ===================================================================== */
function tierFromPercentile(pct){
  if(pct<=0.25) return {label:'Sangat Kompetitif', emoji:'🟢', cls:'tag-green'};
  if(pct<=0.5) return {label:'Kompetitif', emoji:'🟡', cls:'tag-amber'};
  if(pct<=0.75) return {label:'Kurang Kompetitif', emoji:'🟠', cls:'tag-amber'};
  return {label:'Tidak Kompetitif', emoji:'🔴', cls:'tag-red'};
}
function renderHeatmap(body){
  const dates = distinctDates();
  const allRows = [];
  Object.keys(CATEGORY_META).forEach(cat=>{
    const rows = rankedByCategory(cat, heatmapDate);
    const n = rows.length;
    rows.forEach(r=>{
      const beliPct = (r.rank-1)/(Math.max(n-1,1));
      const sortedJual = [...rows].sort((a,b)=>effJual(b)-effJual(a)); // higher jual = better, rank1=best
      const jualRankIdx = sortedJual.findIndex(x=>x.id===r.id);
      const jualPct = jualRankIdx/(Math.max(n-1,1));
      const sortedSpread = [...rows].sort((a,b)=>a.spread-b.spread);
      const spreadRankIdx = sortedSpread.findIndex(x=>x.id===r.id);
      const spreadPct = spreadRankIdx/(Math.max(n-1,1));
      const overallPct = (beliPct+jualPct+spreadPct)/3;
      allRows.push({...r, category:cat, beliTier:tierFromPercentile(beliPct), jualTier:tierFromPercentile(jualPct),
        spreadTier:tierFromPercentile(spreadPct), overallTier:tierFromPercentile(overallPct)});
    });
  });

  body.innerHTML = `
  <div style="margin-bottom:14px; display:flex; align-items:center; gap:10px;">
    <label style="margin:0;">Tanggal:</label>
    <select id="heatDateSel">${[...dates].reverse().map(d=>`<option value="${d}" ${d===heatmapDate?'selected':''}>${fmtDateLabel(d)}</option>`).join('')}</select>
  </div>
  <div class="legend">
    <span>🟢 Sangat Kompetitif</span><span>🟡 Kompetitif</span><span>🟠 Kurang Kompetitif</span><span>🔴 Tidak Kompetitif</span>
  </div>
  <div class="table-wrap">
  <table>
    <thead><tr><th>Perusahaan</th><th>Kategori</th><th style="text-align:right;">Harga Beli</th><th>Tier Beli</th>
      <th style="text-align:right;">Harga Jual</th><th>Tier Jual</th><th style="text-align:right;">Spread</th><th>Tier Spread</th><th>Overall</th></tr></thead>
    <tbody>
    ${allRows.map(r=>`<tr class="${isBSI(r.company)?'row-bsi':''}">
      <td>${r.company}</td><td>${CATEGORY_META[r.category].short}</td>
      <td class="num-cell">Rp ${fmt(r.eff)}</td><td><span class="heat-cell ${r.beliTier.cls}">${r.beliTier.emoji} ${r.beliTier.label}</span></td>
      <td class="num-cell">Rp ${fmt(effJual(r))}</td><td><span class="heat-cell ${r.jualTier.cls}">${r.jualTier.emoji} ${r.jualTier.label}</span></td>
      <td class="num-cell">${fmtPct(r.spread)}</td><td><span class="heat-cell ${r.spreadTier.cls}">${r.spreadTier.emoji} ${r.spreadTier.label}</span></td>
      <td><span class="heat-cell ${r.overallTier.cls}">${r.overallTier.emoji} ${r.overallTier.label}</span></td>
    </tr>`).join('')}
    </tbody>
  </table>
  </div>
  <div class="flag">Tier dihitung berdasarkan peringkat persentil dalam masing-masing kategori pada tanggal terpilih (25% teratas = Sangat Kompetitif, dst).</div>
  `;
  body.querySelector('#heatDateSel').addEventListener('change', e=>{ heatmapDate=e.target.value; renderAll(); });
}

/* =====================================================================
   7. MOVEMENT HARIAN
   ===================================================================== */
function renderMovement(body){
  const dates = distinctDates();
  if(dates.length<2){
    body.innerHTML = `<div class="empty">Butuh minimal 2 tanggal data untuk menampilkan pergerakan harian.</div>`;
    return;
  }
  if(!movementDateA || !dates.includes(movementDateA)) movementDateA = dates[dates.length-2];
  if(!movementDateB || !dates.includes(movementDateB)) movementDateB = dates[dates.length-1];

  const rowsA = RECORDS.filter(r=>r.date===movementDateA && r.beli!=null);
  const rows = rowsA.map(r=>{
    const rowB = RECORDS.find(x=>x.date===movementDateB && x.category===r.category && x.company===r.company);
    if(!rowB || rowB.beli==null) return null;
    const curEff = effVal(rowB), prevEff = effVal(r);
    const delta = curEff - prevEff;
    const pct = delta/prevEff*100;
    return {company:r.company, category:r.category, prev:prevEff, cur:curEff, delta, pct};
  }).filter(Boolean);
  rows.sort((a,b)=>b.delta-a.delta);

  body.innerHTML = `
  <div style="display:flex; align-items:flex-end; gap:14px; margin-bottom:16px; flex-wrap:wrap;">
    <div><label>Tanggal Pembanding (A)</label>
      <div class="datepart-group">${datePickerHtml('movA', dates, movementDateA)}</div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace; color:var(--muted); padding-bottom:8px;">→</div>
    <div><label>Tanggal Pembanding (B)</label>
      <div class="datepart-group">${datePickerHtml('movB', dates, movementDateB)}</div>
    </div>
  </div>
  <div class="section-note" style="margin-bottom:14px;">Perbandingan ${fmtDateLabel(movementDateA)} → ${fmtDateLabel(movementDateB)}, harga dinormalisasi per gram.</div>
  ${CATEGORY_ORDER.map(cat=>{
    const catRows = rows.filter(r=>r.category===cat);
    return `
    <div class="section-title">${CATEGORY_META[cat].label}</div>

        <td>${r.delta>0?'<span class="tag tag-red">Naik</span>':r.delta<0?'<span class="tag tag-green">Turun</span>':'<span class="tag tag-amber">Tetap</span>'}</td>

/* =====================================================================
   8. EXECUTIVE INSIGHT (AUTO GENERATED)
   ===================================================================== */
function renderInsight(body){
  const ld = latestDate();
  const kilo = rankedByCategory('kilobar', ld);
  const fisik = rankedByCategory('fisik', ld);
  const rekening = rankedByCategory('rekening', ld);
  const bsi = kilo.find(r=>isBSI(r.company));
  const cheapestKilo = kilo[0];
  const allLatest = [...kilo, ...fisik, ...rekening];
  const withSpread = allLatest.filter(r=>r.spread!=null && r.spread>0);
  const minSpread = withSpread.length ? Math.min(...withSpread.map(r=>r.spread)) : null;
  const lowestSpreadCos = withSpread.filter(r=>minSpread!=null && Math.abs(r.spread-minSpread)<0.05).map(r=>r.company);
  const bsiRank = bsi ? bsi.rank : null;
  const savingTon = (bsi && cheapestKilo) ? (bsi.eff-cheapestKilo.eff)*1000000 : null;
  const selisihBsiRp = (bsi && cheapestKilo) ? bsi.eff-cheapestKilo.eff : null;

  const insights = [];
  insights.push(`<b>${cheapestKilo?cheapestKilo.company:'—'}</b> masih menjadi supplier kilobar paling kompetitif per ${fmtDateLabel(ld)}, dengan harga beli Rp ${fmt(cheapestKilo?.eff)}/gram.`);
  insights.push(selisihBsiRp!=null ? `Harga beli BSI berada <b>Rp ${fmt(selisihBsiRp)}/gram</b> ${selisihBsiRp>=0?'di atas':'di bawah'} ${cheapestKilo?cheapestKilo.company:'supplier termurah'}.` : `Data harga beli BSI kilobar belum tersedia untuk tanggal ini.`);
  insights.push(lowestSpreadCos.length ? `Spread terendah (${fmtPct(minSpread)}) dimiliki oleh <b>${lowestSpreadCos.join(', ')}</b>.` : `Data spread belum cukup untuk ditentukan.`);
  insights.push(savingTon!=null ? `Terdapat potensi saving <b>Rp ${fmt(Math.abs(savingTon))}</b> per 1 ton jika sourcing dilakukan dari ${cheapestKilo.company} dibandingkan BSI.` : `Potensi saving belum dapat dihitung karena data tidak lengkap.`);
  insights.push(bsiRank!=null ? `Posisi kompetitif BSI berada pada peringkat <b>${bsiRank} dari ${kilo.length}</b> supplier kilobar yang terpantau.` : `Posisi kompetitif BSI belum dapat ditentukan untuk kategori kilobar.`);

  body.innerHTML = `<ul class="insight-list">${insights.map(t=>`<li>${t}</li>`).join('')}</ul>
  <div class="flag" style="margin-top:14px;">Insight ini dihasilkan otomatis dari data terbaru (${fmtDateLabel(ld)}) dan akan berubah seiring data baru ditambahkan pada tab Data Input.</div>`;
}

/* ---------- CSV export/import ---------- */
function csvCell(v){
  if(v===null||v===undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(){
  const header = ['Tanggal','Kategori','Perusahaan','Harga Beli','Harga Jual'];
  const lines = [header.join(',')];
  [...RECORDS].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0).forEach(r=>{
    lines.push([csvCell(r.date), csvCell(r.category), csvCell(r.company), csvCell(r.beli), csvCell(r.jual)].join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gold-price-data-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV berhasil diunduh.');
}
function parseCsvLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}
function parseMoney(v){
  if(v===undefined||v===null) return null;
  const s = String(v).trim();
  if(s==='') return null;
  const cleaned = s.replace(/[^0-9\-]/g,'');
  if(cleaned==='' || cleaned==='-') return null;
  const n = parseInt(cleaned,10);
  return n===0 ? null : n;
}
function parseFlexibleDate(s){
  s = (s||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const months = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  let m = s.match(/^(\d{1,2})-([A-Za-z]{3,})-(\d{2,4})$/);
  if(m){
    const mon = months[m[2].slice(0,3).toLowerCase()];
    if(mon){ let yr=m[3]; if(yr.length===2) yr='20'+yr; return `${yr}-${mon}-${m[1].padStart(2,'0')}`; }
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
// Alias untuk menyamakan penamaan lama (database historis) dengan penamaan template terbaru
const COMPANY_ALIAS = {
  'kilobar|AMNT 1000 GR':'Amman Mineral Nusa Tenggara 1000 gr',
  'kilobar|GALERI 1000 GR':'Galeri 24 1000 gr',
  'kilobar|STONEX - IDR':'StoneX (kilogram)',
  'fisik|STONEX - IDR':'StoneX',
  'kilobar|UOB - IDR':'UOB (Cast Bars 1 kilobar)',
  'kilobar|XAU - IDR':'XAU',
  'kilobar|LOCO LONDON - IDR':'Loco London'
};
function canonicalCompany(category, name){
  const key = category+'|'+name.toUpperCase();
  return COMPANY_ALIAS[key] || name;
}
// Judul seksi yang muncul pada template ekspor harian (format tanpa kolom Kategori eksplisit)
const SECTION_HEADERS = {
  'APLIKASI (REKENING EMAS)':'rekening',
  'HARGA EMAS FISIK':'fisik',
  'HARGA EMAS FISIK KILOBAR':'kilobar'
};
async function handleCsvUpload(e){
  const file = e.target.files[0];
  const statusEl = document.getElementById('uploadStatus');
  if(!file) return;
  try{
    const text = await file.text();
    const lines = text.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).filter(l=>l.trim()!=='');
    if(lines.length<2){ statusEl.textContent = 'File CSV kosong atau tidak valid.'; return; }
    const rawHeader = parseCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
    const idx = {
      date: rawHeader.findIndex(h=>h.includes('tanggal')||h.includes('date')),
      category: rawHeader.findIndex(h=>h.includes('kategori')||h.includes('category')),
      company: rawHeader.findIndex(h=>h.includes('perusahaan')||h.includes('company')),
      beli: rawHeader.findIndex(h=>h.includes('beli')&&!h.includes('limit')),
      jual: rawHeader.findIndex(h=>h.includes('jual')&&!h.includes('limit'))
    };
    if(idx.company===-1 || idx.beli===-1){
      statusEl.textContent = 'Header CSV tidak dikenali. Pastikan ada kolom Perusahaan dan Harga Beli.';
      return;
    }
    let parsed=0, skipped=0;
    const useExplicitCategory = idx.category!==-1;
    let currentCategory = null;
    const byDate = new Map(); // date -> [{category, company, beli, jual}]
    for(let i=1;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      const companyRaw = (cols[idx.company]||'').trim();
      const beli = parseMoney(cols[idx.beli]);

      if(!useExplicitCategory){
        const headerKey = companyRaw.toUpperCase();
        if(SECTION_HEADERS[headerKey]){ currentCategory = SECTION_HEADERS[headerKey]; continue; }
        if(!companyRaw){ continue; }
      }

      const category = useExplicitCategory ? (cols[idx.category]||'').trim().toLowerCase() : currentCategory;
      const date = parseFlexibleDate(idx.date>-1 ? (cols[idx.date]||'') : '');
      const jual = idx.jual>-1 ? parseMoney(cols[idx.jual]) : null;

      if(!date || !CATEGORY_META[category] || !companyRaw || beli==null){ skipped++; continue; }
      const company = canonicalCompany(category, companyRaw);
      if(!byDate.has(date)) byDate.set(date, []);
      byDate.get(date).push({category, company, beli, jual});
      parsed++;
    }
    if(parsed===0){
      statusEl.textContent = `Tidak ada baris valid untuk diunggah${skipped>0?` (${skipped} dilewati)`:''}.`;
      return;
    }
    statusEl.textContent = `Mengunggah ${parsed} baris ke ${byDate.size} tanggal...`;
    const result = await bulkUpsert(byDate);
    if(!result.ok){
      statusEl.textContent = 'Upload dibatalkan (perlu PIN untuk menulis data).';
      return;
    }
    rankingDate = null; heatmapDate = null; spreadDate = null; movementDateA = null; movementDateB = null;
    showToast(`Upload selesai: ${result.added} baris tersinkron${skipped>0?`, ${skipped} dilewati`:''}.`);
    renderAll();
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Gagal membaca file CSV.';
  }
}

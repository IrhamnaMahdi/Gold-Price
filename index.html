<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Price Intelligence — Executive Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181F;
    --ink-soft:#1D2530;
    --ink-line:#323C49;
    --paper:#FFFFFF;
    --paper-card:#FFFFFF;
    --line:#E7E3D6;
    --gold:#A9812F;
    --gold-bright:#D9A93E;
    --gold-pale:#F5E8C4;
    --green:#2E7D4F;
    --green-pale:#E1F2E5;
    --red:#C23B24;
    --red-pale:#FBE2DA;
    --amber:#B0721C;
    --amber-pale:#FCEBCE;
    --blue:#2758A0;
    --blue-pale:#DDE9FA;
    --teal:#0E8C93;
    --teal-pale:#DAF3F3;
    --purple:#6E4FA0;
    --purple-pale:#EBE3F7;
    --ink-text:#181D26;
    --muted:#726A5A;
    --shadow:0 1px 3px rgba(20,20,30,.06), 0 6px 18px rgba(20,20,30,.05);
    --shadow-hover:0 4px 10px rgba(20,20,30,.08), 0 14px 30px rgba(20,20,30,.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--paper);
    color:var(--ink-text);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .app{display:flex; min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:236px; flex:none; background:linear-gradient(180deg,#12181F,#1B2431 55%,#12181F); color:#D9D4C6;
    padding:22px 0 22px 0; position:sticky; top:0; height:100vh; overflow-y:auto; box-shadow:2px 0 18px rgba(0,0,0,.12);
  }
  .brand{padding:0 20px 18px 20px; border-bottom:1px solid var(--ink-line); margin-bottom:10px;}
  .ribbon{height:5px; background:linear-gradient(90deg,#D9A93E,#2758A0,#0E8C93,#2E7D4F,#6E4FA0,#C23B24); margin:-30px -38px 26px -38px; border-radius:0 0 3px 3px;}
  @media (max-width:760px){.ribbon{margin:-22px -16px 22px -16px;}}
  .brand-mark{background:linear-gradient(90deg,#F1E4C2,#D9A93E 60%,#F1E4C2); -webkit-background-clip:text; background-clip:text; color:transparent; font-family:'IBM Plex Serif',serif; font-size:19px; font-weight:700; letter-spacing:.2px;}
  .brand-sub{font-size:11px; color:#8B8878; margin-top:4px; line-height:1.5;}
  nav{display:flex; flex-direction:column; margin-top:6px;}
  .navbtn{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none;
    color:#B9B4A4; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:11px 20px;
    cursor:pointer; border-left:3px solid transparent; transition:background .12s ease;
  }
  .navbtn:hover{background:rgba(255,255,255,.04); color:#EDE7D6;}
  .navbtn.active{background:rgba(217,169,62,.14); color:#F5E8C4; border-left:3px solid var(--gold-bright); font-weight:700; box-shadow:inset 0 0 18px rgba(217,169,62,.08);}
  .navbtn .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#847E6C; width:16px;}
  .navbtn.active .n{color:var(--gold-bright);}
  .sidebar-foot{padding:16px 20px 0 20px; margin-top:12px; border-top:1px solid var(--ink-line); font-size:10.5px; color:#726C5C; line-height:1.6;}

  /* ---------- MAIN ---------- */
  main{flex:1; min-width:0; padding:30px 38px 60px 38px;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
  .pagetitle{font-family:'IBM Plex Serif',serif; font-size:27px; font-weight:700; background:linear-gradient(90deg,#181D26,#2758A0 55%,#0E8C93); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .pagesub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .datebadge{background:linear-gradient(120deg,#12181F,#2A3644); color:var(--gold-pale); font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:8px 14px; border-radius:20px; white-space:nowrap; box-shadow:var(--shadow);}

  .grid{display:grid; gap:16px;}
  .kpi-grid{grid-template-columns:repeat(6,1fr);}
  @media (max-width:1300px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:760px){.kpi-grid{grid-template-columns:repeat(2,1fr);} main{padding:22px 16px 50px 16px;}}

  .card{background:var(--paper-card); border:1px solid var(--line); border-radius:10px; padding:16px 17px; box-shadow:var(--shadow); transition:box-shadow .18s ease, transform .18s ease;}
  .kpi{display:flex; flex-direction:column; gap:6px; min-height:118px; border-top:4px solid var(--gold-bright); position:relative;}
  .kpi:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .kpi-grid .card:nth-child(1){border-top-color:#D9A93E;}
  .kpi-grid .card:nth-child(2){border-top-color:#2758A0;}
  .kpi-grid .card:nth-child(3){border-top-color:#2E7D4F;}
  .kpi-grid .card:nth-child(4){border-top-color:#C23B24;}
  .kpi-grid .card:nth-child(5){border-top-color:#6E4FA0;}
  .kpi-grid .card:nth-child(6){border-top-color:#0E8C93;}
  .kpi-label{font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.1px; display:flex; align-items:center; gap:6px;}
  .kpi-value{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; color:var(--ink-text); line-height:1.25;}
  .kpi-value.big{font-size:23px;}
  .kpi-sub{font-size:11.5px; color:var(--muted);}
  .kpi-sub.pos{color:var(--green); font-weight:600;}
  .kpi-sub.neg{color:var(--red); font-weight:600;}

  .section-title{font-family:'IBM Plex Serif',serif; font-size:17.5px; font-weight:700; margin:34px 0 12px 0; color:var(--ink-text); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-bottom:9px; border-bottom:3px solid transparent; border-image:linear-gradient(90deg,#D9A93E,#2758A0,#0E8C93) 1; }
  .section-title:first-of-type{margin-top:0;}
  .section-note{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Sans',sans-serif; font-weight:400;}

  select, input[type=date], input[type=text], input[type=number]{
    font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; padding:7px 9px; border:1px solid var(--line);
    border-radius:3px; background:#fff; color:var(--ink-text);
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{
    text-align:left; font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:11px; color:#fff;
    background:linear-gradient(120deg,#12181F,#2A3644); border-bottom:none; padding:10px 10px; white-space:nowrap;
  }
  tbody td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody tr:hover{background:#FBF9F2;}
  .num-cell{font-family:'IBM Plex Mono',monospace; text-align:right;}
  .tag{display:inline-block; padding:3px 10px; border-radius:12px; font-size:10.5px; font-weight:700;}
  .tag-green{background:var(--green-pale); color:var(--green);}
  .tag-amber{background:var(--amber-pale); color:var(--amber);}
  .tag-red{background:var(--red-pale); color:var(--red);}
  .tag-blue{background:var(--blue-pale); color:var(--blue);}
  .row-rank1{background:var(--green-pale) !important;}
  .row-rank2{background:var(--gold-pale) !important;}
  .row-rankLast{background:var(--red-pale) !important;}
  .row-bsi td:first-child{border-left:3px solid var(--blue);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);}
  .table-wrap table{min-width:640px;}
  .table-wrap thead th, .table-wrap tbody td{white-space:nowrap;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:2px; display:inline-block;}

  .chart-card{padding:20px; box-shadow:none;}
  .svgchart{width:100%; height:auto; display:block;}
  .svgchart .gridline{stroke:#E4DECC; stroke-width:1;}
  .svgchart .axis-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:var(--muted);}
  .svgchart .series-line{fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;}
  .svgchart .series-dot{stroke:#fff; stroke-width:1.4;}
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--ink-text);}
  .chart-legend span{display:inline-flex; align-items:center; gap:6px;}
  .chart-legend i{width:11px; height:11px; border-radius:2px; display:inline-block;}
  .chart-tt{font-family:'IBM Plex Mono',monospace; font-size:9.5px; fill:var(--ink-text);}
  .bullet-row{display:grid; grid-template-columns:130px 1fr 130px; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line);}
  .bullet-row:last-child{border-bottom:none;}
  .bullet-track{background:#EDE9DC; border-radius:3px; height:22px; position:relative; overflow:hidden;}
  .bullet-fill{position:absolute; top:0; left:0; height:100%; border-radius:3px;}
  .bullet-fill.bsi{background:var(--blue);}
  .bullet-fill.market{background:var(--gold);}
  .bullet-label{font-size:12px; font-weight:600;}
  .bullet-val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right;}

  .insight-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .insight-list li{background:var(--paper-card); border:1px solid var(--line); border-left:4px solid var(--gold-bright); border-radius:8px; padding:13px 15px; font-size:13px; line-height:1.55; box-shadow:var(--shadow);}
  .insight-list b{color:var(--ink-text);}

  .heat-cell{padding:6px 11px; border-radius:12px; font-size:11.5px; font-weight:700; text-align:center; display:inline-block; min-width:118px; box-shadow:0 1px 2px rgba(0,0,0,.06);}

  form.input-form{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:900px){form.input-form{grid-template-columns:repeat(2,1fr);}}
  .btn{
    font-family:'IBM Plex Sans',sans-serif; font-weight:700; font-size:12.5px; padding:10px 18px; border-radius:22px;
    border:none; background:linear-gradient(120deg,#12181F,#2A3644); color:var(--gold-pale); cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-hover);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none;}
  .btn-ghost:hover{background:#F6F4EC; transform:none; box-shadow:none;}
  .btn-danger{background:transparent; border:none; color:var(--red); cursor:pointer; font-size:12px; font-weight:700;}
  .tabbar{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tabbar button{
    font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:600; padding:8px 15px; border-radius:18px; border:1px solid var(--line);
    background:#fff; cursor:pointer; color:var(--muted); box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .tabbar button:hover{transform:translateY(-1px);}
  .tabbar button.active{background:linear-gradient(120deg,#12181F,#2A3644); color:var(--gold-pale); border-color:var(--ink);}
  .flag{font-size:11px; color:var(--muted); font-style:italic; margin-top:8px;}
  .empty{color:var(--muted); font-size:13px; padding:20px; text-align:center;}
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--gold-pale); padding:11px 18px;
    border-radius:4px; font-size:12.5px; opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>

function seed(){
  return SEED_ROWS.map((r,i)=>({id:i+1, date:r[0], category:r[1], company:r[2], beli:r[3], jual:r[4]===undefined?null:r[4], limitBeli:'', limitBuyback:''}));
}
let RECORDS = [];
let nextId = 1;

/* =====================================================================
   STORAGE
   ===================================================================== */
async function loadData(){
  try{
    const res = await window.storage.get('gold-records-v2', false);
    if(res && res.value){
      RECORDS = JSON.parse(res.value);
      nextId = RECORDS.reduce((m,r)=>Math.max(m,r.id),0)+1;
    } else {
      RECORDS = seed();
      nextId = RECORDS.reduce((m,r)=>Math.max(m,r.id),0)+1;
      await saveData();
    }
  }catch(e){
    RECORDS = seed();
    nextId = RECORDS.reduce((m,r)=>Math.max(m,r.id),0)+1;
    try{ await saveData(); }catch(e2){}
  }
  renderAll();
}
async function saveData(){
  try{ await window.storage.set('gold-records-v2', JSON.stringify(RECORDS), false); }
  catch(e){ console.error('Storage error', e); showToast('Gagal menyimpan data ke storage.'); }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =====================================================================
   HELPERS
   ===================================================================== */
const fmt = n => n===null||n===undefined||isNaN(n) ? '—' : Math.round(n).toLocaleString('id-ID');
const fmtJuta = n => n===null||n===undefined||isNaN(n) ? '—' : (n/1000000).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' Jt';
const fmtPct = n => n===null||n===undefined||isNaN(n) ? '—' : n.toFixed(2)+'%';
function normKilobar(v){ if(v===null||v===undefined) return null; return v>10000000 ? v/1000 : v; }
function effVal(rec){ return rec.category==='kilobar' ? normKilobar(rec.beli) : rec.beli; }
function effJual(rec){ return rec.category==='kilobar' ? normKilobar(rec.jual) : rec.jual; }
function spreadOf(rec){ const b=effVal(rec), j=effJual(rec); if(b==null||j==null) return null; return (b-j)/b*100; }
function distinctDates(){ return [...new Set(RECORDS.map(r=>r.date))].sort(); }
function latestDate(){ const d=distinctDates(); return d[d.length-1]; }
function prevDate(){ const d=distinctDates(); return d.length>1 ? d[d.length-2] : null; }
function fmtDateLabel(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return `${day} ${months[parseInt(m)-1]} ${y}`; }
function byCategoryDate(cat,date){ return RECORDS.filter(r=>r.category===cat && r.date===date); }
function rankedByCategory(cat,date){
  const rows = byCategoryDate(cat,date).filter(r=>r.beli!=null).map(r=>({...r, eff:effVal(r), spread:spreadOf(r)}));
  rows.sort((a,b)=>a.eff-b.eff);
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
function isBSI(company){ return /BSI/i.test(company); }

   ===================================================================== */
function renderAll(){
  renderNav();
  const main = document.getElementById('main');
  const ld = latestDate();
  if(!rankingDate) rankingDate = ld;
  if(!heatmapDate) heatmapDate = ld;
  if(!spreadDate) spreadDate = ld;
  let html = `<div class="ribbon"></div>
  <div class="topbar">
    <div>
      <div class="pagetitle">${TABS.find(t=>t.id===activeTab).label}</div>
      <div class="pagesub">Tanggal monitoring terbaru</div>
    </div>
    <div class="datebadge">${fmtDateLabel(ld)}</div>
  </div>`;
  main.innerHTML = html;
  const body = document.createElement('div');
  main.appendChild(body);
  if(activeTab==='overview') renderOverview(body);
  else if(activeTab==='ranking') renderRanking(body);
  else if(activeTab==='trend') renderTrend(body);
  else if(activeTab==='spread') renderSpread(body);
  else if(activeTab==='movement') renderMovement(body);
  else if(activeTab==='input') renderInput(body);
}

function renderOverview(body){
  const ld = latestDate(), pd = prevDate();
  const kilo = rankedByCategory('kilobar', ld);
  const fisik = rankedByCategory('fisik', ld);

/* =====================================================================
   3. TREND HARGA HARIAN  (dependency-free hand-built SVG line chart)
   ===================================================================== */
function buildTrendSvg(dates, series){
  const W=900, H=340, padL=68, padR=24, padT=18, padB=40;
  const plotW = W-padL-padR, plotH = H-padT-padB;

  const allVals = series.flatMap(s=>s.data.filter(v=>v!=null));
  if(allVals.length===0){
    return `<div class="empty">Belum ada data kilobar untuk ditampilkan.</div>`;
  }
  let vMin = Math.min(...allVals), vMax = Math.max(...allVals);
  if(vMin===vMax){ vMin*=0.98; vMax*=1.02; }
  const pad = (vMax-vMin)*0.12;
  vMin -= pad; vMax += pad;

  const xStep = dates.length>1 ? plotW/(dates.length-1) : 0;
  const xAt = i => padL + (dates.length>1 ? i*xStep : plotW/2);
  const yAt = v => padT + plotH - ( (v-vMin)/(vMax-vMin) )*plotH;

  const gridCount = 5;
  let gridlines = '';
  let yLabels = '';
  for(let g=0; g<=gridCount; g++){
    const v = vMin + (vMax-vMin)*g/gridCount;
    const y = yAt(v);
    gridlines += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"></line>`;
    yLabels += `<text class="axis-label" x="${padL-8}" y="${y+4}" text-anchor="end">Rp ${(v/1000000).toFixed(2)}jt</text>`;
  }
  let xLabels = '';
  const labelStep = Math.max(1, Math.ceil(dates.length/11));
  dates.forEach((d,i)=>{
    if(i%labelStep===0 || i===dates.length-1){
      xLabels += `<text class="axis-label" x="${xAt(i)}" y="${H-padB+18}" text-anchor="middle">${fmtDateLabel(d)}</text>`;
    }
  });

  let lines = '';
  series.forEach(s=>{
    const pts = s.data.map((v,i)=> v==null ? null : [xAt(i), yAt(v)]);
    // line path (allows gaps for nulls)
    let d='', drawing=false;
    pts.forEach(p=>{
      if(p==null){ drawing=false; return; }
      d += (drawing?' L ':' M ')+p[0].toFixed(1)+' '+p[1].toFixed(1);
      drawing = true;
    });
    // soft area fill under each contiguous segment (visual weight, no numbers)
    let seriesAreas = '';
    let segStart = -1;
    for(let i=0;i<pts.length;i++){
      const p = pts[i];
      const isLast = i===pts.length-1;
      if(p==null || isLast){
        const endIdx = (p==null) ? i-1 : i;
        if(segStart!==-1 && endIdx>segStart){
          let ad = `M ${pts[segStart][0].toFixed(1)} ${(H-padB).toFixed(1)}`;
          for(let k=segStart;k<=endIdx;k++){ if(pts[k]) ad += ` L ${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)}`; }
          ad += ` L ${pts[endIdx][0].toFixed(1)} ${(H-padB).toFixed(1)} Z`;
          seriesAreas += `<path d="${ad}" fill="${s.color}" opacity="0.07"></path>`;
        }
        segStart = -1;
      } else if(segStart===-1){ segStart = i; }
    }
    lines += seriesAreas;
    lines += `<path class="series-line" d="${d.trim()}" stroke="${s.color}"></path>`;
    if(dates.length<=45){
      pts.forEach(p=>{
        if(p==null) return;
        const size=8;
        lines += `<rect class="series-dot" x="${(p[0]-size/2).toFixed(1)}" y="${(p[1]-size/2).toFixed(1)}" width="${size}" height="${size}" fill="${s.color}"></rect>`;
      });
    }
  });

  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}${yLabels}${xLabels}${lines}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#12181F" stroke-width="1"></line>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#12181F" stroke-width="1"></line>
  </svg>`;
}

function renderTrend(body){
  const allDates = distinctDates();
  const rangeOptions = [
    {v:60, label:'60 Hari Terakhir'},
    {v:180, label:'180 Hari Terakhir'},
    {v:'all', label:'Semua (' + allDates.length + ' Hari)'}
  ];
  if(!trendRange) trendRange = 60;
  const dates = trendRange==='all' ? allDates : allDates.slice(-trendRange);

  const idx = new Map();
  RECORDS.forEach(r=>{ idx.set(r.category+'|'+r.date+'|'+r.company, r); });

  function seriesForCategory(cat){
    let companies, colorOf, labelOf;
    if(cat==='kilobar'){
      companies = TREND_COMPANIES; // 5 supplier utama sesuai brief
      colorOf = (c,i) => brandColor(c,i);
      labelOf = c => KILOBAR_SHORT[c];
    } else {
      companies = CATEGORY_META[cat].companies;
      colorOf = (c,i) => brandColor(c,i);
      labelOf = c => c;
    }
    return companies.map((c,i)=>{
      const data = dates.map(d=>{
        const rec = idx.get(cat+'|'+d+'|'+c);
        if(!rec) return null;
        return trendMetric==='beli' ? effVal(rec) : effJual(rec);
      });
      return {label:labelOf(c), color:colorOf(c,i), data};
    }).filter(s=>s.data.some(v=>v!=null));
  }

  const sections = CATEGORY_ORDER.map(cat=>{
    const series = seriesForCategory(cat);
    return `
    <div class="section-title">${CATEGORY_META[cat].label}
      <span class="section-note">${series.length} supplier ditampilkan</span>
    </div>
    <div class="card chart-card">
      ${dates.length===0 || series.length===0 ? '<div class="empty">Belum ada data untuk kategori ini.</div>' : buildTrendSvg(dates, series)}
      ${series.length ? `<div class="chart-legend">${series.map(s=>`<span><i style="background:${s.color};"></i>${s.label}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  body.innerHTML = `
  <div class="tabbar">
    <button data-m="beli" class="${trendMetric==='beli'?'active':''}">Harga Beli</button>
    <button data-m="jual" class="${trendMetric==='jual'?'active':''}">Harga Jual</button>
  </div>
  <div class="tabbar">
    ${rangeOptions.map(o=>`<button data-r="${o.v}" class="${String(trendRange)===String(o.v)?'active':''}">${o.label}</button>`).join('')}
  </div>
  ${sections}
  <div class="flag">Nilai kategori Fisik Kilobar dinormalisasi ke harga per gram agar sebanding antar supplier. Titik kosong berarti data belum diinput untuk tanggal tersebut.</div>
  `;
  body.querySelectorAll('.tabbar button[data-m]').forEach(b=>b.addEventListener('click', ()=>{ trendMetric=b.dataset.m; renderAll(); }));
  body.querySelectorAll('.tabbar button[data-r]').forEach(b=>b.addEventListener('click', ()=>{ trendRange = b.dataset.r==='all' ? 'all' : parseInt(b.dataset.r); renderAll(); }));
}

/* =====================================================================
   3b. SPREAD BELI-JUAL (%) — per kategori
   ===================================================================== */
function spreadTier(pct){
  if(pct<=3) return {cls:'tag-green', emoji:'🟢', bar:'var(--green)'};
  if(pct<=6) return {cls:'tag-amber', emoji:'🟡', bar:'var(--amber)'};
  return {cls:'tag-red', emoji:'🔴', bar:'var(--red)'};
}
function renderSpread(body){
  const dates = distinctDates();

  const sections = CATEGORY_ORDER.map(cat=>{
    const rows = byCategoryDate(cat, spreadDate)
      .filter(r=>r.beli!=null)
      .map(r=>{
        const beli = effVal(r), jual = effJual(r);
        const spreadRp = (jual!=null) ? beli-jual : null;
        const spreadPct = spreadOf(r);
        return {...r, beli, jual, spreadRp, spreadPct};
      });
    rows.sort((a,b)=>{
      if(a.spreadPct==null) return 1;
      if(b.spreadPct==null) return -1;
      return a.spreadPct-b.spreadPct;
    });
    const validPct = rows.filter(r=>r.spreadPct!=null).map(r=>r.spreadPct);
    const avg = validPct.length ? validPct.reduce((a,b)=>a+b,0)/validPct.length : null;
    const maxPct = validPct.length ? Math.max(...validPct) : 1;

    return `
    <div class="section-title">${CATEGORY_META[cat].label}
      <span class="section-note">Rata-rata spread: ${avg==null?'—':fmtPct(avg)}</span>
    </div>
    <div class="table-wrap" style="margin-bottom:26px;">
    <table>
      <thead><tr><th>No</th><th>Perusahaan</th><th style="text-align:right;">Harga Beli</th><th style="text-align:right;">Harga Jual</th>
        <th style="text-align:right;">Spread (Rp)</th><th style="text-align:right;">Spread (%)</th><th style="min-width:160px;">Visual</th><th>Status</th></tr></thead>
      <tbody>
      ${rows.length===0 ? `<tr><td colspan="8" class="empty">Tidak ada data untuk tanggal ini.</td></tr>` :
        rows.map((r,i)=>{
          const tier = r.spreadPct==null ? null : spreadTier(r.spreadPct);
          const barPct = r.spreadPct==null ? 0 : Math.max(4, r.spreadPct/maxPct*100);
          return `<tr class="${isBSI(r.company)?'row-bsi':''}">
            <td>${i+1}</td>
            <td>${r.company}${isBSI(r.company)?' <span class="tag tag-blue">BSI</span>':''}</td>
            <td class="num-cell">Rp ${fmt(r.beli)}</td>
            <td class="num-cell">${r.jual==null?'—':'Rp '+fmt(r.jual)}</td>
            <td class="num-cell">${r.spreadRp==null?'—':'Rp '+fmt(r.spreadRp)}</td>
            <td class="num-cell" style="font-weight:600;">${fmtPct(r.spreadPct)}</td>
            <td><div style="background:#EDE9DC; border-radius:3px; height:14px; width:150px; position:relative; overflow:hidden;">
                  <div style="position:absolute; left:0; top:0; height:100%; width:${barPct}%; background:${tier?tier.bar:'#ccc'}; border-radius:3px;"></div>
                </div></td>
            <td>${tier?`<span class="tag ${tier.cls}">${tier.emoji} ${r.spreadPct<=3?'Ketat':r.spreadPct<=6?'Sedang':'Lebar'}</span>`:'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
  }).join('');

  body.innerHTML = `
  <div style="margin-bottom:14px; display:flex; align-items:center; gap:10px;">
    <label style="margin:0;">Tanggal:</label>
    <select id="spreadDateSel">${[...dates].reverse().map(d=>`<option value="${d}" ${d===spreadDate?'selected':''}>${fmtDateLabel(d)}</option>`).join('')}</select>
  </div>
  <div class="legend">
    <span>🟢 Spread Ketat (≤3%)</span><span>🟡 Spread Sedang (3–6%)</span><span>🔴 Spread Lebar (&gt;6%)</span>
  </div>
  ${sections}
  <div class="flag">Spread (%) = (Harga Beli − Harga Jual) ÷ Harga Beli × 100. Nilai kategori Fisik Kilobar dinormalisasi per gram agar sebanding.</div>
  `;
  body.querySelector('#spreadDateSel').addEventListener('change', e=>{ spreadDate=e.target.value; renderAll(); });
}

/* =====================================================================
   4. BSI VS MARKET (bullet-style comparison)
   ===================================================================== */
function renderBsiVsMarket(body){
  const ld = latestDate();
  const kilo = rankedByCategory('kilobar', ld);
  const bsi = kilo.find(r=>isBSI(r.company));
  const others = kilo.filter(r=>!isBSI(r.company) && r.jual!=null);
  const bestMarket = others.length ? others.reduce((best,r)=> (effJual(r)>effJual(best)?r:best), others[0]) : null;

  const bsiJual = bsi?effJual(bsi):null;
  const marketJual = bestMarket?effJual(bestMarket):null;
  const selisihRp = (bsiJual!=null && marketJual!=null) ? bsiJual - marketJual : null;
  const selisihPct = (selisihRp!=null && marketJual) ? selisihRp/marketJual*100 : null;
  const maxVal = Math.max(bsiJual||0, marketJual||0) * 1.08;

  body.innerHTML = `
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr; margin-bottom:20px;">
    <div class="card kpi"><div class="kpi-label">Harga Jual (Buyback) BSI</div><div class="kpi-value">Rp ${fmt(bsiJual)} /gr</div></div>
    <div class="card kpi"><div class="kpi-label">Harga Jual Terbaik di Market</div><div class="kpi-value">${bestMarket?bestMarket.company:'—'}</div><div class="kpi-sub">Rp ${fmt(marketJual)} /gr</div></div>
    <div class="card kpi"><div class="kpi-label">Selisih</div><div class="kpi-value big ${selisihRp<0?'neg':'pos'}">${selisihRp==null?'—':(selisihRp<0?'-':'+')+'Rp '+fmt(Math.abs(selisihRp))}</div><div class="kpi-sub ${selisihPct<0?'neg':'pos'}">${selisihPct==null?'':fmtPct(Math.abs(selisihPct))+(selisihPct<0?' di bawah market':' di atas market')}</div></div>
  </div>
  <div class="card chart-card">
    <div class="bullet-row">
      <div class="bullet-label">BSI</div>
      <div class="bullet-track"><div class="bullet-fill bsi" style="width:${maxVal?(bsiJual/maxVal*100):0}%;"></div></div>
      <div class="bullet-val">Rp ${fmt(bsiJual)}</div>
    </div>
    <div class="bullet-row">
      <div class="bullet-label">${bestMarket?bestMarket.company:'Market Terbaik'}</div>
      <div class="bullet-track"><div class="bullet-fill market" style="width:${maxVal?(marketJual/maxVal*100):0}%;"></div></div>
      <div class="bullet-val">Rp ${fmt(marketJual)}</div>
    </div>
  </div>
  <div class="flag">Perbandingan menggunakan Harga Jual (buyback) kategori Fisik Kilobar, dinormalisasi per gram, tanggal ${fmtDateLabel(ld)}.</div>
  `;
}

function tierFromPercentile(pct){
  if(pct<=0.25) return {label:'Sangat Kompetitif', emoji:'🟢', cls:'tag-green'};
  if(pct<=0.5) return {label:'Kompetitif', emoji:'🟡', cls:'tag-amber'};
  if(pct<=0.75) return {label:'Kurang Kompetitif', emoji:'🟠', cls:'tag-amber'};
  return {label:'Tidak Kompetitif', emoji:'🔴', cls:'tag-red'};
}
function renderHeatmap(body){
  const dates = distinctDates();
  const allRows = [];
  Object.keys(CATEGORY_META).forEach(cat=>{
    const rows = rankedByCategory(cat, heatmapDate);
    const n = rows.length;
    rows.forEach(r=>{
      const beliPct = (r.rank-1)/(Math.max(n-1,1));
      const sortedJual = [...rows].sort((a,b)=>effJual(b)-effJual(a)); // higher jual = better, rank1=best
      const jualRankIdx = sortedJual.findIndex(x=>x.id===r.id);
      const jualPct = jualRankIdx/(Math.max(n-1,1));
      const sortedSpread = [...rows].sort((a,b)=>a.spread-b.spread);
      const spreadRankIdx = sortedSpread.findIndex(x=>x.id===r.id);
      const spreadPct = spreadRankIdx/(Math.max(n-1,1));
      const overallPct = (beliPct+jualPct+spreadPct)/3;
      allRows.push({...r, category:cat, beliTier:tierFromPercentile(beliPct), jualTier:tierFromPercentile(jualPct),
        spreadTier:tierFromPercentile(spreadPct), overallTier:tierFromPercentile(overallPct)});

function renderInsight(body){

  const minSpread = withSpread.length ? Math.min(...withSpread.map(r=>r.spread)) : null;
  const lowestSpreadCos = withSpread.filter(r=>minSpread!=null && Math.abs(r.spread-minSpread)<0.05).map(r=>r.company);
  const bsiRank = bsi ? bsi.rank : null;
  const savingTon = (bsi && cheapestKilo) ? (bsi.eff-cheapestKilo.eff)*1000000 : null;

  insights.push(lowestSpreadCos.length ? `Spread terendah (${fmtPct(minSpread)}) dimiliki oleh <b>${lowestSpreadCos.join(', ')}</b>.` : `Data spread belum cukup untuk ditentukan.`);

  body.innerHTML = `<ul class="insight-list">${insights.map(t=>`<li>${t}</li>`).join('')}</ul>

/* ---------- CSV export/import ---------- */
function csvCell(v){
  if(v===null||v===undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(){
  const header = ['Tanggal','Kategori','Perusahaan','Harga Beli','Harga Jual','Limit Beli','Limit Buyback'];
  const lines = [header.join(',')];
  [...RECORDS].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0).forEach(r=>{
    lines.push([csvCell(r.date), csvCell(r.category), csvCell(r.company), csvCell(r.beli), csvCell(r.jual), csvCell(r.limitBeli), csvCell(r.limitBuyback)].join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gold-price-data-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV berhasil diunduh.');
}
function parseCsvLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}
function parseMoney(v){
  if(v===undefined||v===null) return null;
  const s = String(v).trim();
  if(s==='') return null;
  const cleaned = s.replace(/[^0-9\-]/g,'');
  if(cleaned==='' || cleaned==='-') return null;
  const n = parseInt(cleaned,10);
  return n===0 ? null : n;
}
function parseFlexibleDate(s){
  s = (s||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const months = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  let m = s.match(/^(\d{1,2})-([A-Za-z]{3,})-(\d{2,4})$/);
  if(m){
    const mon = months[m[2].slice(0,3).toLowerCase()];
    if(mon){ let yr=m[3]; if(yr.length===2) yr='20'+yr; return `${yr}-${mon}-${m[1].padStart(2,'0')}`; }
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
// Alias untuk menyamakan penamaan lama (database historis) dengan penamaan template terbaru
const COMPANY_ALIAS = {
  'kilobar|AMNT 1000 GR':'Amman Mineral Nusa Tenggara 1000 gr',
  'kilobar|GALERI 1000 GR':'Galeri 24 1000 gr',
  'kilobar|STONEX - IDR':'StoneX (kilogram)',
  'fisik|STONEX - IDR':'StoneX',
  'kilobar|UOB - IDR':'UOB (Cast Bars 1 kilobar)',
  'kilobar|XAU - IDR':'XAU',
  'kilobar|LOCO LONDON - IDR':'Loco London'
};
function canonicalCompany(category, name){
  const key = category+'|'+name.toUpperCase();
  return COMPANY_ALIAS[key] || name;
}
// Judul seksi yang muncul pada template ekspor harian (format tanpa kolom Kategori eksplisit)
const SECTION_HEADERS = {
  'APLIKASI (REKENING EMAS)':'rekening',
  'HARGA EMAS FISIK':'fisik',
  'HARGA EMAS FISIK KILOBAR':'kilobar'
};
async function handleCsvUpload(e){
  const file = e.target.files[0];
  const statusEl = document.getElementById('uploadStatus');
  if(!file) return;
  try{
    const text = await file.text();
    const lines = text.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).filter(l=>l.trim()!=='');
    if(lines.length<2){ statusEl.textContent = 'File CSV kosong atau tidak valid.'; return; }
    const rawHeader = parseCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
    const idx = {
      date: rawHeader.findIndex(h=>h.includes('tanggal')||h.includes('date')),
      category: rawHeader.findIndex(h=>h.includes('kategori')||h.includes('category')),
      company: rawHeader.findIndex(h=>h.includes('perusahaan')||h.includes('company')),
      beli: rawHeader.findIndex(h=>h.includes('beli')&&!h.includes('limit')),
      jual: rawHeader.findIndex(h=>h.includes('jual')&&!h.includes('limit')),
      limitBeli: rawHeader.findIndex(h=>h.includes('limit') && h.includes('beli')),
      limitBuyback: rawHeader.findIndex(h=>h.includes('limit') && (h.includes('buyback')||h.includes('jual')))
    };
    if(idx.company===-1 || idx.beli===-1){
      statusEl.textContent = 'Header CSV tidak dikenali. Pastikan ada kolom Perusahaan dan Harga Beli.';
      return;
    }
    let added=0, skipped=0;
    const useExplicitCategory = idx.category!==-1;
    let currentCategory = null;
    for(let i=1;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      const companyRaw = (cols[idx.company]||'').trim();
      const beliRaw = cols[idx.beli];
      const beli = parseMoney(beliRaw);

      if(!useExplicitCategory){
        // Format template harian: baris judul seksi menandai kategori berikutnya
        const headerKey = companyRaw.toUpperCase();
        if(SECTION_HEADERS[headerKey]){ currentCategory = SECTION_HEADERS[headerKey]; continue; }
        if(!companyRaw){ continue; } // baris pemisah kosong
      }

      const category = useExplicitCategory ? (cols[idx.category]||'').trim().toLowerCase() : currentCategory;
      const date = parseFlexibleDate(idx.date>-1 ? (cols[idx.date]||'') : '');
      const jual = idx.jual>-1 ? parseMoney(cols[idx.jual]) : null;
      const limitBeli = idx.limitBeli>-1 ? (cols[idx.limitBeli]||'').trim() : '';
      const limitBuyback = idx.limitBuyback>-1 ? (cols[idx.limitBuyback]||'').trim() : '';

      if(!date || !CATEGORY_META[category] || !companyRaw || beli==null){ skipped++; continue; }
      const company = canonicalCompany(category, companyRaw);
      RECORDS.push({id:nextId++, date, category, company, beli, jual, limitBeli, limitBuyback});
      added++;
    }
    if(added>0){
      await saveData();
      rankingDate = null; heatmapDate = null; spreadDate = null;
      movementDateA = null; movementDateB = null;
    }
    showToast(`Upload selesai: ${added} baris ditambahkan${skipped>0?`, ${skipped} dilewati`:''}.`);
    renderAll();
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Gagal membaca file CSV.';
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
loadData();
</script>
